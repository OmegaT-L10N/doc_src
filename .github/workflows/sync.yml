name: Sync English manual from upstream

on:
  schedule:
    # Every Saturday at 03:03 UTC
    - cron: '3 3 * * 6'
  workflow_dispatch:
    inputs:
      reason:
        description: Optional reason for manual run
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-i18n-en
  cancel-in-progress: false

env:
  UPSTREAM_REPO_URL: https://dev.azure.com/omegat-org/OmegaT/_git/omegat
  DEFAULT_BRANCH: master
  DEFAULT_DOCS_DIR: src/docs
  OLD_MAINTENANCE_BRANCH: releases/6.0
  OLD_MAINTENANCE_DOCS_DIR: doc_src
  OLD_MAINTENANCE_TREE_DIR: omegat-releases-6.0
  OLD_MAINTENANCE_BRANCH_TARGET: manuals-6.0
  MAINTENANCE_BRANCH: releases/6.1
  MAINTENANCE_DOCS_DIR: src_docs
  MAINTENANCE_TREE_DIR: omegat-releases-6.1
  MAINTENANCE_BRANCH_TARGET: manual-6.1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "l10n-github-actions@noreply.omegat.org"

      - name: Fetch from upstream repository
        run: |
          set -euo pipefail
          fetch_docs() {   # branch, destination dir, paths...
            local branch=$1 dir=$2; shift 2
            git clone --depth=1 --filter=blob:none --sparse --branch "$branch" "$UPSTREAM_REPO_URL" "$dir"
            git -C "$dir" sparse-checkout set "$@"
          }
          fetch_docs "$DEFAULT_BRANCH" _upstream "$DEFAULT_DOCS_DIR/manual/en" "$DEFAULT_DOCS_DIR/greeting/en" "$DEFAULT_DOCS_DIR/tips/en"
          fetch_docs "$MAINTENANCE_BRANCH" "_upstream/$MAINTENANCE_TREE_DIR" "$MAINTENANCE_DOCS_DIR/manual/en"
          fetch_docs "$OLD_MAINTENANCE_BRANCH" "_upstream/$OLD_MAINTENANCE_TREE_DIR" "$OLD_MAINTENANCE_DOCS_DIR/en"

      - name: Replace local English with upstream version
        run: |
          set -euo pipefail
          rm -rf manual greeting tips "$MAINTENANCE_BRANCH_TARGET" "$OLD_MAINTENANCE_BRANCH_TARGET"
          mkdir -p manual greeting tips "$MAINTENANCE_BRANCH_TARGET" "$OLD_MAINTENANCE_BRANCH_TARGET"
          # Copy manual, greeting and tips from src/docs/* at master branch
          cp -r "_upstream/$DEFAULT_DOCS_DIR/manual/en/"*   manual/
          cp -r "_upstream/$DEFAULT_DOCS_DIR/greeting/en/"* greeting/
          cp -r "_upstream/$DEFAULT_DOCS_DIR/tips/en/"*     tips/
          # releases/6.1
          cp -r "_upstream/$MAINTENANCE_TREE_DIR/$MAINTENANCE_DOCS_DIR/manual/en/"* "$MAINTENANCE_BRANCH_TARGET/"
          # releases/6.0
          cp -r "_upstream/$OLD_MAINTENANCE_TREE_DIR/$OLD_MAINTENANCE_DOCS_DIR/en/"* "$OLD_MAINTENANCE_BRANCH_TARGET/"

      - name: Stage changes
        run: |
          git add manual greeting tips "$OLD_MAINTENANCE_BRANCH_TARGET" "$MAINTENANCE_BRANCH_TARGET"

      - name: Check for differences
        id: diff
        run: |
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          ts="$(date -u +'%Y-%m-%d')"
          git commit -m "Sync manual(en) from upstream ${UPSTREAM_REPO} on ${ts}"

      - name: Push to master
        if: steps.diff.outputs.changed == 'true'
        run: |
          git push origin HEAD:master
